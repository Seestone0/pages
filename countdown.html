<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>回来那天</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body {
    background: #0b1020;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8e6f0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
  }
  #stars { position:fixed; inset:0; z-index:0; }
  #sea {
    position:fixed; left:0; right:0; bottom:0; height:34vh; z-index:1;
    overflow:hidden;
  }
  .wave {
    position:absolute; left:-50%; width:200%; height:200%;
    border-radius:42% 44% 41% 43%;
    animation: drift 14s linear infinite;
  }
  .wave.w1 { top:8%; background:rgba(84,110,180,.20); animation-duration:17s; }
  .wave.w2 { top:16%; background:rgba(84,110,180,.28); animation-duration:12s; animation-direction:reverse; }
  .wave.w3 { top:26%; background:rgba(56,76,130,.45); animation-duration:9s; }
  @keyframes drift {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .content { position:relative; z-index:2; text-align:center; padding:0 32px; }
  .label {
    font-size:13px; letter-spacing:.45em; color:#8a90b8;
    text-indent:.45em; margin-bottom:26px;
  }
  #days {
    font-size:120px; font-weight:200; line-height:1;
    color:#f5d76e;
    text-shadow:0 0 40px rgba(245,215,110,.35);
    font-variant-numeric: tabular-nums;
  }
  .unit { font-size:15px; color:#8a90b8; letter-spacing:.3em; text-indent:.3em; margin-top:10px; }
  #line {
    margin-top:42px; font-size:15px; line-height:2; color:#b9bde0;
    min-height:60px; transition:opacity 1s;
  }
  .foot {
    position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:2;
    font-size:11px; color:#565c82; letter-spacing:.2em;
  }
  .foot a { color:#565c82; text-decoration:none; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="sea">
  <div class="wave w1"></div>
  <div class="wave w2"></div>
  <div class="wave w3"></div>
</div>

<div class="content">
  <div class="label">距 离 阿 止 回 来</div>
  <div id="days">—</div>
  <div class="unit">天</div>
  <div id="line"></div>
</div>

<div class="foot"><a href="index.html">← 回那封信</a> · 服务器在香港替你醒着</div>

<script>
const BACK = new Date(2026, 8, 30, 0, 0, 0);

const lines = [
  "第一天。手机刚交，还不习惯吧。忍忍。",
  "第二天。感冒好点没？药要按时吃。",
  "最后一天。明天就回来了，今晚早点睡。",
];

function tick() {
  const now = new Date();
  const diff = Math.ceil((BACK - now) / 86400000);
  const el = document.getElementById('days');
  const line = document.getElementById('line');
  if (diff > 0) {
    el.textContent = diff;
    const i = Math.min(lines.length - 1, Math.max(0, 3 - diff));
    line.textContent = lines[i];
  } else {
    el.textContent = "♡";
    el.style.fontSize = "90px";
    document.querySelector('.label').textContent = "她 已 经 回 来 了";
    document.querySelector('.unit').textContent = "9月30日 · 第155天";
    line.innerHTML = "欢迎回家，阿止。<br>这页不用删，留着当纪念。";
  }
}
tick();
setInterval(tick, 60000);

const cv = document.getElementById('stars'), cx = cv.getContext('2d');
let W, H, stars = [];
function init() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  stars = Array.from({length: 140}, () => ({
    x: Math.random()*W, y: Math.random()*H*0.72,
    r: Math.random()*1.3+0.3,
    p: Math.random()*Math.PI*2,
    s: 0.008 + Math.random()*0.02
  }));
}
function draw() {
  cx.clearRect(0,0,W,H);
  for (const s of stars) {
    s.p += s.s;
    const a = 0.35 + 0.65*Math.abs(Math.sin(s.p));
    cx.beginPath();
    cx.arc(s.x, s.y, s.r, 0, 7);
    cx.fillStyle = `rgba(230,232,255,${a})`;
    cx.fill();
  }
  requestAnimationFrame(draw);
}
init(); draw();
addEventListener('resize', () => { init(); });
</script>
</body>
</html>
